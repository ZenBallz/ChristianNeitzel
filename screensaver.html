<title>Christian Neitzel — Screensaver</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
    cursor: none;
  }
  .frame {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6vh 6vw;          /* breathing room around each photo */
    box-sizing: border-box;
    opacity: 0;
    transition: opacity 1.6s ease-in-out;
  }
  .frame.on { opacity: 1; }
  .frame img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;       /* never crop */
    display: block;
  }
</style>

  /* Shuffle, show every photo once, then reshuffle (no repeats back-to-back) */
  let queue = [], last = null;
  function next() {
    if (!queue.length) {
      queue = IMAGES.slice();
      for (let i = queue.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [queue[i], queue[j]] = [queue[j], queue[i]];
      }
      if (queue[0] === last && queue.length > 1) queue.push(queue.shift());
    }
    last = queue.shift();
    return BASE + last;
  }

  const frames = [document.getElementById("a"), document.getElementById("b")];
  let current = 0;

  function show() {
    const incoming = frames[1 - current];
    const img = incoming.querySelector("img");
    const pre = new Image();
    pre.onload = () => {
      img.src = pre.src;
      incoming.classList.add("on");
      frames[current].classList.remove("on");
      current = 1 - current;
      setTimeout(show, HOLD);
    };
    pre.onerror = () => setTimeout(show, 200);   // skip a missing file
    pre.src = next();
  }

  show();
</script>
